name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen --no-dev

      - name: Build and import Python application
        run: |
          uv run --no-sync python -m compileall -q main.py
          uv run --no-sync python -c "import main; assert main.app.title == 'ObscuraLens API'"

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Check web application
        run: npm run check

      - name: Build web application
        run: npm run build