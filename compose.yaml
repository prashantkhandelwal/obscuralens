services:
  app:
    image: ghcr.io/prashantkhandelwal/obscuralens:latest
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:0.6b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-32768}
      OBSCURA_MCP_URL: http://obscura:8080/mcp
    depends_on:
      ollama-model:
        condition: service_completed_successfully
      obscura:
        condition: service_started
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ollama-model:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen3:0.6b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  obscura:
    image: h4ckf0r0day/obscura:latest
    command: ["mcp", "--http", "--host", "0.0.0.0", "--port", "8080"]
    restart: unless-stopped

volumes:
  ollama-data: